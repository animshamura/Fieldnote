{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d382d">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=9">
</head>
<body class="{{ body_class }}">
  <div id="root"></div>
  {{ bootstrap|json_script:"fieldnote-bootstrap" }}
  {% if invite_url %}<input id="invite-link-bootstrap" type="hidden" value="{{ invite_url }}">{% endif %}
  <script type="module" src="{% static 'js/app.js' %}?v=11"></script>
</body>
</html>
